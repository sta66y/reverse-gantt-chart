version: "3"

services:
  postgres:
    image: postgres:16
    container_name: database_host
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=storage
    ports:
      - "54321:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "61379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data: